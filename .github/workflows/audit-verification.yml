name: Audit Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  byte-order-verification:
    name: Byte-Order & E2E Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.14.0"
      
      - name: Setup Starknet Foundry
        uses: foundry-rs/setup-snfoundry@v3
        with:
          starknet-foundry-version: "0.56.0"
      
      # CRITICAL: Security tests (highest priority)
      - name: Run Security Tests
        run: |
          cd cairo
          snforge test security_ --detailed-resources
      
      # CRITICAL: End-to-end Rust ↔ Cairo compatibility
      - name: Run E2E Tests
        run: |
          cd cairo
          snforge test e2e_ --detailed-resources
      
      # CRITICAL: Byte-order and challenge computation verification
      - name: Run Unit Tests (BLAKE2s, DLEQ)
        run: |
          cd cairo
          snforge test unit_ --detailed-resources
      
      # Integration tests
      - name: Run Integration Tests
        run: |
          cd cairo
          snforge test integration_ --detailed-resources

      - name: Full Cairo Suite Must Have No Ignored Tests
        run: |
          cd cairo
          set -o pipefail
          snforge test --detailed-resources | tee /tmp/snforge-full.out
          if grep -Eq ', [1-9][0-9]* ignored' /tmp/snforge-full.out; then
            echo "Ignored Cairo tests are not allowed in the production readiness suite"
            exit 1
          fi

  gas-benchmarking:
    name: Gas Cost Benchmarking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Scarb & Starknet Foundry
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.14.0"
      
      - uses: foundry-rs/setup-snfoundry@v3
        with:
          starknet-foundry-version: "0.56.0"
      
      - name: Run Gas Benchmarks
        run: |
          cd cairo
          snforge test benchmark_dleq_verification_gas --detailed-resources > gas_report.txt 2>&1
      
      - name: Upload Gas Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: gas-report
          path: cairo/gas_report.txt
